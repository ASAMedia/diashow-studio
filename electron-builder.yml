appId: de.asamedia.diashowstudio
productName: Diashow Studio
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/exiftool-vendored*/**
  # loaded by a worker thread via dynamic import(), which cannot read from app.asar
  - node_modules/libraw-wasm/**
extraResources:
  - from: vendor/ffmpeg/bin
    to: ffmpeg
    filter: ['*.exe', '*.dll']
  # FFmpeg's GPL licence and which BtbN build it is (About dialog, THIRD_PARTY_NOTICES)
  - from: vendor/ffmpeg
    to: ffmpeg
    filter: ['LICENSE.txt', 'build.json']
  # the theme songs (scripts/theme-music.mjs), found by src/main/themeMusic.ts in resources/theme-music
  - from: resources/theme-music
    to: theme-music
    filter: ['*.m4a', 'theme-music.json']
# next to the exe: the app's licence and every third-party licence (scripts/third-party-notices.mjs)
extraFiles:
  - from: vendor/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: LICENSE
    to: LICENSE.txt
# app icon (made by scripts/make-icon.mjs from build/icon.svg): exe, installer, uninstaller, shortcuts
win:
  target: [nsis, portable]
  icon: build/icon.ico
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
fileAssociations:
  - ext: dshow
    name: Diashow Studio project
    description: Diashow Studio project
    icon: build/icon.ico
# Electron fuses: the packaged exe ignores ELECTRON_RUN_AS_NODE and NODE_OPTIONS (it cannot be
# misused as a Node runtime), loads app code only from app.asar, and encrypts cookies. Node's inspect
# arguments stay available: the e2e tests drive a packaged build (DIASHOW_EXE) through them.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
